<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Gear Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'sha256-9C8xxthlh9pfzo75MGRZCm4CZq0D8csdn6Uic8HKvbA='; script-src-attr 'unsafe-hashes' 'sha256-3twywiVOjkum7R0Dfaj4LqnqTBj//9Uzd/4+lECHbbs='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://a.tile.openstreetmap.org https://b.tile.openstreetmap.org https://c.tile.openstreetmap.org; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="/styles/vendor/leaflet-1.9.4.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
    <script src="/js/vendor/leaflet-1.9.4.min.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
    <script src="/js/vendor/chart-4.5.0.umd.min.js" integrity="sha384-XcdcwHqIPULERb2yDEM4R0XaQKU3YnDsrTmjACBZyfdVVqjh6xQ4/DCMd7XLcA6Y" crossorigin="anonymous"></script>
</head>

<body>
    <div class="container">
        <div style="margin-bottom: 1.5rem;">
            <button onclick="window.history.back()"
                style="padding: 8px 16px; border: 1px solid #e2e8f0; border-radius: 8px; background: white; cursor: pointer; font-size: 0.875rem; color: #374151; font-weight: 500;">
                ← Back
            </button>
        </div>

        <!-- Hero: icon, name, badges, top stats -->
        <div id="gear-hero"></div>

        <!-- Gear Health -->
        <div id="gear-health-section" class="data-section">
            <h3>Gear Health</h3>
            <div id="gear-health-content"></div>
        </div>

        <!-- Stats + Patterns side by side -->
        <div class="side-by-side-container">
            <div id="gear-stats-section" class="data-section">
                <h3>Statistics</h3>
                <div id="gear-stats-content"></div>
            </div>
            <div id="gear-advanced-section" class="data-section">
                <h3>Patterns &amp; Records</h3>
                <div id="gear-advanced-content"></div>
            </div>
        </div>

        <!-- Map + Usage chart -->
        <div class="side-by-side-container">
            <div id="gear-map-section" class="data-section">
                <h3>Activities Map</h3>
                <div id="gear-map" style="height: 380px; border-radius: 8px; overflow: hidden;"></div>
            </div>
            <div id="gear-usage-section" class="data-section">
                <h3>Usage Over Time</h3>
                <div class="chart-container-inner">
                    <canvas id="gear-usage-chart"></canvas>
                </div>
            </div>
        </div>

        <!-- Pace + Elevation -->
        <div class="side-by-side-container">
            <div id="gear-pace-section" class="data-section">
                <h3>Pace Evolution</h3>
                <div class="chart-container-inner">
                    <canvas id="gear-pace-chart"></canvas>
                </div>
            </div>
            <div id="gear-elevation-section" class="data-section">
                <h3>Cumulative Elevation</h3>
                <div class="chart-container-inner">
                    <canvas id="gear-elevation-chart"></canvas>
                </div>
            </div>
        </div>

        <!-- Activities list -->
        <div id="gear-activities-section" class="data-section">
            <h3>Activities with this Gear</h3>
            <div id="gear-activities-list"></div>
        </div>
    </div>

    <script type="module">
        import { renderGearDetailPage } from '../js/pages/gear/index.js';

        function showFixedError(message) {
            const container = document.createElement('div');
            container.style.cssText = 'padding:2rem;text-align:center;';
            const title = document.createElement('h2');
            title.textContent = message;
            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = '← Back';
            button.style.cssText = 'margin-top:1rem;padding:8px 16px;border:1px solid #ddd;border-radius:6px;cursor:pointer;';
            button.addEventListener('click', () => window.history.back());
            container.append(title, button);
            document.body.replaceChildren(container);
        }

        async function startGearPage() {
            if (typeof globalThis.Chart !== 'function') {
                showFixedError('Visualization runtime unavailable');
                return;
            }
            const urlParams = new URLSearchParams(window.location.search);
            const gearId = urlParams.get('id');
            if (!gearId) {
                showFixedError('No gear ID provided');
                return;
            }
            await renderGearDetailPage(gearId);
        }

        void startGearPage();
    </script>
</body>

</html>
