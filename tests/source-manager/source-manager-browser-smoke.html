        const V2_NAME = 'strava-stats-v2';
        const SENTINEL_NAME = 'synthetic-pr10-legacy-like-sentinel';
        const AUTHORIZATION_STATE_KEY = 'source_manager_authorization_state';
        const AUTHORIZATION_STATE = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopq';
        const state = document.getElementById('state');
        const summary = document.getElementById('summary');
        const offlineContinue = document.getElementById('offline-continue');
        const frames = document.getElementById('frames');
        const gates = [];
        const metrics = {
            authorization: 0,
            externalHttp: 0,
            fetch: 0,
            provider: 0,
            telemetry: 0,
            xhr: 0,
            webSocket: 0
        };
        const encoder = new TextEncoder();
        const crcTable = Array.from({ length: 256 }, (_, index) => {
            let value = index;
            for (let bit = 0; bit < 8; bit += 1) {
                value = (value >>> 1) ^ ((value & 1) ? 0xedb88320 : 0);
            }
            return value >>> 0;
        });

        function assert(value, code) {
            if (!value) throw new Error(code);
            gates.push(code);
        }

        async function waitFor(check, code, timeout = 20_000) {
            const started = performance.now();
            while (performance.now() - started < timeout) {
                let value = null;
                try { value = check(); } catch { value = null; }
                if (value) return value;
                await new Promise(resolve => setTimeout(resolve, 25));
            }
            throw new Error(code);
        }

        async function waitForAsync(check, code, timeout = 20_000) {
            const started = performance.now();
            while (performance.now() - started < timeout) {
                let value = null;
                try { value = await check(); } catch { value = null; }
                if (value) return value;
                await new Promise(resolve => setTimeout(resolve, 25));
            }
            throw new Error(code);
        }

        function request(request) {
            return new Promise((resolve, reject) => {
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(new Error('IDB_REQUEST_FAILED'));
            });
        }

        function transaction(transaction) {
            return new Promise((resolve, reject) => {
                transaction.oncomplete = resolve;
                transaction.onabort = () => reject(new Error('IDB_TRANSACTION_ABORTED'));
                transaction.onerror = () => {};
            });
        }

        async function ensureSentinel() {
            const opened = indexedDB.open(SENTINEL_NAME, 1);
            opened.onupgradeneeded = () => {
                opened.result.createObjectStore('syntheticRecords', { keyPath: 'id' })
                    .add({ id: 'synthetic-pr10', values: [null, 0, 'value'] });
            };
            const database = await request(opened);
            database.close();
        }

        async function sentinelSnapshot() {
            const database = await request(indexedDB.open(SENTINEL_NAME));
            const tx = database.transaction('syntheticRecords', 'readonly');
            const records = await request(tx.objectStore('syntheticRecords').getAll());
            await transaction(tx);
            database.close();
            return JSON.stringify(records);
        }

        async function v2Snapshot() {
            const database = await request(indexedDB.open(V2_NAME));
            const stores = Array.from(database.objectStoreNames).sort();
            const tx = database.transaction(stores, 'readonly');
            const counts = {};
            const indexes = {};
            for (const name of stores) {
                const store = tx.objectStore(name);
                counts[name] = await request(store.count());
                indexes[name] = Array.from(store.indexNames).sort();
            }
            await transaction(tx);
            const version = database.version;
            database.close();
            return { version, stores, indexes, counts };
        }

        async function sourceConnectionSnapshot() {
            const database = await request(indexedDB.open(V2_NAME));
            const tx = database.transaction('sourceConnections', 'readonly');
            const value = await request(
                tx.objectStore('sourceConnections').get('source-connection:strava')
            );
            await transaction(tx);
            database.close();
            return value ?? null;
        }

        function prepareAuthorizationState(storage) {
            const createdAt = Date.now();
            storage.setItem(AUTHORIZATION_STATE_KEY, JSON.stringify({
                schemaVersion: 1,
                state: AUTHORIZATION_STATE,
                createdAt,
                expiresAt: createdAt + 600_000,
                returnPath: '/source-manager.html?mode=real'
            }));
        }

        async function databaseContainsText(name, text) {
            const database = await request(indexedDB.open(name));
            const stores = Array.from(database.objectStoreNames).sort();
            let found = false;
            for (const storeName of stores) {
                const tx = database.transaction(storeName, 'readonly');
                const cursorRequest = tx.objectStore(storeName).openCursor();
                await new Promise((resolve, reject) => {
                    cursorRequest.onerror = () => reject(new Error('IDB_CURSOR_FAILED'));
                    cursorRequest.onsuccess = () => {
                        const cursor = cursorRequest.result;
                        if (!cursor) {
                            resolve();
                            return;
                        }
                        if (JSON.stringify([cursor.key, cursor.value]).includes(text)) {
                            found = true;
                            resolve();
                            return;
                        }
                        cursor.continue();
                    };
                });
                if (found) break;
            }
            database.close();
            return found;
        }

        function webStorageSnapshot(storage) {
            const entries = [];
            for (let index = 0; index < storage.length; index += 1) {
                const key = storage.key(index);
                entries.push([key, storage.getItem(key)]);
            }
            return JSON.stringify(entries);
        }

        function crc32(bytes) {
            let crc = 0xffffffff;
            for (const byte of bytes) crc = crcTable[(crc ^ byte) & 0xff] ^ (crc >>> 8);
            return (crc ^ 0xffffffff) >>> 0;
        }

        function u16(value) {
            return Uint8Array.of(value & 0xff, (value >>> 8) & 0xff);
        }

        function u32(value) {
            return Uint8Array.of(
                value & 0xff,
                (value >>> 8) & 0xff,
                (value >>> 16) & 0xff,
                (value >>> 24) & 0xff
            );
        }

        function join(parts) {
            const output = new Uint8Array(parts.reduce((sum, part) => sum + part.byteLength, 0));
            let offset = 0;
            for (const part of parts) {
                output.set(part, offset);
                offset += part.byteLength;
            }
            return output;
        }

        function storedZip(csv) {
            const name = encoder.encode('activities.csv');
            const content = encoder.encode(csv);
            const checksum = crc32(content);
            const local = join([
                u32(0x04034b50), u16(10), u16(0x0800), u16(0), u16(0), u16(0),
                u32(checksum), u32(content.byteLength), u32(content.byteLength),
                u16(name.byteLength), u16(0), name, content
            ]);
            const central = join([
                u32(0x02014b50), u16(0x0314), u16(10), u16(0x0800), u16(0),
                u16(0), u16(0), u32(checksum), u32(content.byteLength),
                u32(content.byteLength), u16(name.byteLength), u16(0), u16(0),
                u16(0), u16(0), u32((0o100644 << 16) >>> 0), u32(0), name
            ]);
            return join([
                local, central, u32(0x06054b50), u16(0), u16(0), u16(1), u16(1),
                u32(central.byteLength), u32(local.byteLength), u16(0)
            ]);
        }

        function csv(id, type = 'Run') {

        async function proveNoReferrer(frame) {
            const probe = frame.contentDocument.createElement('iframe');
            probe.title = 'synthetic referrer policy probe';
            probe.src = `/icon-sport.svg?synthetic-referrer-probe=${Date.now()}`;
            const loaded = Promise.race([
                new Promise((resolve, reject) => {
                    probe.onload = resolve;
                    probe.onerror = reject;

                new Promise((_, reject) => setTimeout(
                    () => reject(new Error('REFERRER_PROBE_TIMEOUT')),
                    10_000

            ]);
            frame.contentDocument.body.append(probe);
            await loaded;
            assert(probe.contentDocument.referrer === '', 'SUBSEQUENT_RESOURCE_HAS_NO_REFERRER');
            probe.remove();
        }

        async function proveServiceWorkerQueryBypass() {
            const cacheNamesBefore = new Set(await caches.keys());
            const registrationsBefore = await navigator.serviceWorker.getRegistrations();
            assert(registrationsBefore.length === 0, 'SERVICE_WORKER_BASELINE_EMPTY');
            state.textContent = 'verifying service worker query bypass';
            const registration = await Promise.race([
                navigator.serviceWorker.register('/sw.js', { scope: '/' }),
                new Promise((_, reject) => setTimeout(
                    () => reject(new Error('SERVICE_WORKER_REGISTER_TIMEOUT')),
                    20_000
                ))
            ]);
            let controlledFrame = null;
            try {
                await waitFor(
                    () => registration.active?.state === 'activated',
                    'SERVICE_WORKER_ACTIVATION_TIMEOUT'
                );
                controlledFrame = await createNavigationFrame(
                    '?mode=demo',
                    'service worker query bypass Source Manager'
                );
                await waitFor(
                    () => controlledFrame.contentWindow.navigator.serviceWorker.controller !== null,
                    'SERVICE_WORKER_CONTROL_TIMEOUT'
                );
                assert(true, 'INSTALLED_SERVICE_WORKER_CONTROL');
                for (const cacheName of await caches.keys()) {
                    const cache = await caches.open(cacheName);
                    const cachedQuery = await cache.match('/source-manager.html?mode=demo');
                    assert(cachedQuery === undefined, 'QUERY_NAVIGATION_NOT_CACHED');
                }
            } finally {
                controlledFrame?.remove();
                await registration.unregister();
                for (const cacheName of await caches.keys()) {
                    if (!cacheNamesBefore.has(cacheName)) await caches.delete(cacheName);
                }
            }
            assert(
                (await navigator.serviceWorker.getRegistrations()).length === registrationsBefore.length
                    && JSON.stringify((await caches.keys()).sort())
                        === JSON.stringify([...cacheNamesBefore].sort()),
                'SERVICE_WORKER_STATE_RESTORED'
            );
        }

        async function proveOfflinePresentation(realFrame) {
            state.textContent = 'awaiting synthetic offline origin';
            offlineContinue.hidden = false;
            await new Promise(resolve => {
                offlineContinue.addEventListener('click', resolve, { once: true });

        async function choose(frame, source, file, useDrop = false) {
            const doc = frame.contentDocument;
            doc.querySelector(`[data-open-import="${source}"]`).click();
            await waitFor(() => doc.getElementById('import-dialog').open, 'DIALOG_OPEN_TIMEOUT');
            const realmFile = new frame.contentWindow.File(
                [await file.arrayBuffer()],
                file.name,
                { type: file.type }
            );
            const transfer = new frame.contentWindow.DataTransfer();
            transfer.items.add(realmFile);
            if (useDrop) {
                doc.getElementById('dropzone').dispatchEvent(new frame.contentWindow.DragEvent('drop', {
                    bubbles: true,
                    cancelable: true,
                    dataTransfer: transfer
                }));
            } else {
                const input = doc.getElementById('file-input');
                Object.defineProperty(input, 'files', { value: transfer.files, configurable: true });
                input.dispatchEvent(new frame.contentWindow.Event('change', { bubbles: true }));
            }
            await waitFor(
                () => !doc.getElementById('selection-summary').hidden,
                'PREFLIGHT_TIMEOUT'
            );
            return doc;
        }

        async function auditServedProductionSources() {
            const paths = [
                '../../js/source-manager.js',
                '../../js/app/source-manager.js',
                '../../js/app/source-manager-connection.js',
                '../../js/pages/source-manager/source-manager.js'
            ];
            for (const path of paths) {
                const response = await fetch(path, { cache: 'no-store', credentials: 'omit' });
                if (!response.ok) throw new Error('SOURCE_AUDIT_FETCH_FAILED');
                const source = await response.text();
                metrics.authorization += (
                    source.match(/Bearer|access_token|refresh_token|Authorization\s*:/gi) || []
                ).length;
                metrics.webSocket += (source.match(/\bWebSocket\b/g) || []).length;
            }
        }

        async function importFile(frame, source, file, expectedReports, useDrop = false) {
            const doc = await choose(frame, source, file, useDrop);
            if (useDrop) assert(!doc.getElementById('selection-summary').hidden, 'DROP_SELECTION_READY');
            assert(!doc.getElementById('start-import').disabled, 'PREFLIGHT_READY');
            doc.getElementById('start-import').click();
            await waitFor(
                () => doc.querySelectorAll('.report-card').length >= expectedReports,
                'IMPORT_REPORT_TIMEOUT',
                30_000
            );
            return doc;
        }

        function collectResources(frame) {
            const origin = location.origin;
            for (const entry of frame.contentWindow.performance.getEntriesByType('resource')) {
                let url;
                try { url = new URL(entry.name); } catch { continue; }
                const externalHttp = url.origin !== origin && /^https?:$/.test(url.protocol);
                if (externalHttp) metrics.externalHttp += 1;
                if (externalHttp && /strava|garmin|coros|wahoo|polar/i.test(url.hostname + url.pathname)) {
                    metrics.provider += 1;
                }
                if (/analytics|telemetry|insights|gtag|tagmanager/i.test(url.hostname + url.pathname)) metrics.telemetry += 1;
                if (entry.initiatorType === 'fetch') metrics.fetch += 1;
                if (entry.initiatorType === 'xmlhttprequest') metrics.xhr += 1;
            }
        }

        async function retryArtifact(content) {
            const bytes = encoder.encode(content);
            const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
            const sha256 = Array.from(digest, value => value.toString(16).padStart(2, '0')).join('');
            return {
                id: `raw:${sha256}`,
                sha256,
                mediaType: 'application/vnd.stravastats.synthetic+json',
                byteLength: bytes.byteLength,
                content,
                acquiredVia: 'local-file',
                importedAt: new Date().toISOString(),
                state: 'pending',
                activityId: null
            };
        }

        async function seedRetryJob({ jobId, itemPrefix, itemCount = 1, withBytes = true }) {
            const content = JSON.stringify(retryBundle(`synthetic:${jobId}:activity`));
            const artifact = await retryArtifact(content);
            const database = await request(indexedDB.open(V2_NAME));
            const tx = database.transaction(
                ['importJobs', 'importItems', 'rawArtifacts'],
                'readwrite'
            );
            const completedAt = new Date().toISOString();
            tx.objectStore('importJobs').put({
                id: jobId,
                status: 'failed_decode',
                totalItems: itemCount,
                completedItems: itemCount,
                createdAt: completedAt,
                completedAt,
                retryCount: 0,
                errorCode: 'WORKER_CRASHED'
            });
            for (let ordinal = 0; ordinal < itemCount; ordinal += 1) {
                tx.objectStore('importItems').put({
                    id: `${itemPrefix}-${ordinal + 1}`,
                    jobId,
                    ordinal,
                    artifactId: artifact.id,
                    status: 'failed_decode',
                    errorCode: 'WORKER_CRASHED',
                    retryable: true,
                    activityId: null
                });
            }
            if (withBytes) tx.objectStore('rawArtifacts').put(artifact);
            await transaction(tx);
            database.close();
            return artifact;
        }

        async function readRetryRecord(storeName, id) {
            const database = await request(indexedDB.open(V2_NAME));
            const tx = database.transaction(storeName, 'readonly');
            const value = await request(tx.objectStore(storeName).get(id));
            await transaction(tx);
            database.close();
            return value;
        }

        async function writeOperation(record) {
            const database = await request(indexedDB.open(V2_NAME));
            const tx = database.transaction('sourceOperations', 'readwrite');
            tx.objectStore('sourceOperations').put(record);
            await transaction(tx);
            database.close();
        }

        async function reload(frame) {
            const loaded = new Promise(resolve => { frame.onload = resolve; });
            frame.contentWindow.location.reload();
            await loaded;
        }

        async function runRetryEvidence() {
            let evidenceFrame = null;
            let evidenceSecond = null;
            let evidenceDemo = null;
            try {
                await ensureSentinel();
                const sentinelBefore = await sentinelSnapshot();
                evidenceFrame = await createFrame('real');
                const eligibleJob = 'private-durable-job-eligible';
                const eligibleItem = 'private-durable-item-eligible';
                const artifact = await seedRetryJob({
                    jobId: eligibleJob,
                    itemPrefix: eligibleItem
                });
                await reload(evidenceFrame);
                let doc = evidenceFrame.contentDocument;
                await waitFor(
                    () => doc.querySelector('.report-card__retry-actions button'),
                    'RETRY_RELOAD_RECONSTRUCTION_TIMEOUT'
                );
                const beforeReload = await readRetryRecord('importJobs', eligibleJob);
                assert(beforeReload.status === 'failed_decode', 'RELOAD_NO_AUTO_RETRY_STATUS');
                assert(beforeReload.retryCount === 0, 'RELOAD_NO_AUTO_RETRY_COUNT');
                await reload(evidenceFrame);
                doc = evidenceFrame.contentDocument;
                const retryButton = await waitFor(
                    () => doc.querySelector('.report-card__retry-actions button'),
                    'RETRY_ELIGIBLE_TIMEOUT'
                );
                const serialized = doc.documentElement.outerHTML;
                for (const forbidden of [
                    eligibleJob,
                    eligibleItem,
                    artifact.id,
                    artifact.sha256,
                    'private-athlete-retry.fit',
                    '/private/athlete/retry.fit',
                    '37.123456,-122.654321',
                    'heart-rate-private-199',
                    'power-private-777',
                    'Bearer synthetic-private-token',
                    'private-provider-response',
                    'Synthetic Retry Evidence'
                ]) {
                    assert(!serialized.includes(forbidden), 'RETRY_DOM_REDACTION');
                }
                assert(!/retry-[1-9][0-9]*-[1-9][0-9]*/.test(serialized),
                    'RETRY_HANDLE_NOT_SERIALIZED');
                retryButton.click();
                await waitForAsync(
                    () => readRetryRecord('importJobs', eligibleJob)
                        .then(job => job?.status === 'completed'),
                    'RETRY_COMPLETION_TIMEOUT',
                    30_000
                );
                assert(
                    doc.getElementById('import-live').textContent
                        === 'Retry completed. Previously committed items were kept.',
                    'RETRY_COMPLETED_FIXED_COPY'
                );
                assert((await readRetryRecord('importJobs', eligibleJob)).retryCount === 1,
                    'RETRY_COUNT_EXACTLY_ONCE');

                const missingJob = 'private-durable-job-missing';
                await seedRetryJob({
                    jobId: missingJob,
                    itemPrefix: 'private-durable-item-missing',
                    withBytes: false
                });
                await reload(evidenceFrame);
                doc = evidenceFrame.contentDocument;
                await waitFor(
                    () => doc.body.textContent.includes(
                        'The preserved local import bytes are unavailable. The existing import record was not changed.'
                    ),
                    'RETRY_MISSING_BYTES_COPY_TIMEOUT'
                );
                assert(!doc.body.textContent.includes(missingJob), 'RETRY_MISSING_ID_REDACTED');

                const cancelJob = 'private-durable-job-cancel';
                await seedRetryJob({
                    jobId: cancelJob,
                    itemPrefix: 'private-durable-item-cancel',
                    itemCount: 250
                });
                const idle = await readRetryRecord(
                    'sourceOperations',
                    'source-operation:manager'
                );
                const heartbeatAt = new Date().toISOString();
                await writeOperation({
                    ...idle,
                    status: 'active',
                    kind: 'local_import',
                    phase: 'importing',
                    ownerId: '11111111-1111-4111-8111-111111111111',
                    operationId: '22222222-2222-4222-8222-222222222222',
                    jobId: cancelJob,

                assert(blockedFrame.contentWindow.location.hash === '', 'BLOCKED_FRAGMENT_REMOVED');
                assert(blockedFrame.contentDocument.getElementById('blocking-error-code').textContent === 'NAVIGATION_SANITIZATION_FAILED', 'BLOCKED_FIXED_CODE');
                assert(blockedFrame.contentDocument.getElementById('blocking-error-copy').textContent === 'The Source Manager navigation could not be accepted safely.', 'BLOCKED_FIXED_COPY');
                assert(blockedFrame.contentDocument.getElementById('first-run').hidden, 'BLOCKED_NO_APPLICATION_START');
                assert(!blockedFrame.contentDocument.body.textContent.includes(canary), 'BLOCKED_CANARY_NOT_IN_DOM');
                collectResources(blockedFrame);
            }

            await proveServiceWorkerQueryBypass();

            state.textContent = 'verifying navigation data isolation';
            const v2 = await v2Snapshot();
            const sentinelAfter = await sentinelSnapshot();
            assert(JSON.stringify(v2) === JSON.stringify(v2BeforeNavigation), 'NAVIGATION_NO_V2_MUTATION');
            assert(!await databaseContainsText(V2_NAME, canary), 'CALLBACK_CANARY_NOT_IN_V2_CONTENT');
            assert(!sentinelAfter.includes(canary), 'CALLBACK_CANARY_NOT_IN_LEGACY_CONTENT');
            assert(webStorageSnapshot(localStorage) === localStorageBeforeNavigation, 'NAVIGATION_NO_LOCAL_STORAGE_MUTATION');
            assert(webStorageSnapshot(sessionStorage) === sessionStorageBeforeNavigation, 'NAVIGATION_NO_SESSION_STORAGE_MUTATION');
            assert(sentinelBefore === sentinelAfter, 'LEGACY_SENTINEL_UNCHANGED');
            assert(v2.version === 5, 'V2_VERSION_5');
            assert(v2.stores.length === 14, 'V2_FOURTEEN_STORES');
            assert(Object.values(v2.indexes).reduce((sum, list) => sum + list.length, 0) === 14, 'V2_FOURTEEN_INDEXES');
            assert(v2.counts.activities === 8, 'CANONICAL_ACTIVITY_COUNT');
            assert(v2.counts.mergeCandidates >= 2, 'CANDIDATE_AUDIT_RETAINED');
            assert(v2.counts.mergeDecisions >= 2, 'DECISION_AUDIT_RETAINED');

            await proveOfflinePresentation(realFrame);

            const registrations = await navigator.serviceWorker.getRegistrations();
            const cacheNames = await caches.keys();
            assert(registrations.length === 0, 'NO_SERVICE_WORKERS');
            assert(cacheNames.length === 0, 'NO_CACHE_STORAGE');
            assert(metrics.authorization === 0, 'ZERO_AUTHORIZATION_LITERAL_LEAKS');
            assert(metrics.externalHttp === 0, 'ZERO_EXTERNAL_HTTP');
            assert(metrics.provider === 0, 'ZERO_REAL_PROVIDER_REQUESTS');
            assert(metrics.telemetry === 0, 'ZERO_TELEMETRY');
            assert(metrics.xhr === 0, 'ZERO_XHR');
            assert(metrics.webSocket === 0, 'ZERO_WEBSOCKET');
            assert(metrics.fetch >= 5 && metrics.fetch <= 6, 'BOUNDED_SYNTHETIC_SAME_ORIGIN_REQUESTS');

            realFrame.remove();
            demoFrame.remove();
            authorizedFrame.remove();
            mismatchFrame.remove();
            navigationFrames.forEach(frame => frame.remove());
            await new Promise(resolve => setTimeout(resolve, 100));
            const result = {
                status: 'passed',
                gates,
                metrics,
                externalDriverRequired: [
                    'origin stopped before synthetic offline continuation',
                    'all API routes intercepted before frame navigation or import',
                    'disposable server returns only synthetic auth/revoke/provider Sync responses',
                    'all console output contains no callback canary',
                    'startup console warnings and errors',
                    'uncaught exceptions and unhandled rejections'
                ],
                v2: {
                    version: v2.version,
                    stores: v2.stores,
                    indexes: v2.indexes,
                    counts: v2.counts
                }
            };
            document.body.dataset.status = 'passed';
            state.textContent = 'passed';
            summary.textContent = JSON.stringify(result, null, 2);
        } catch (error) {
            const diagnostic = authorizedFrame?.contentDocument
                ? {
                    apiStatus: authorizedFrame.contentDocument
                        .querySelector('[data-source-card="api"]')?.dataset.status ?? null,
                    apiCopy: authorizedFrame.contentDocument
                        .getElementById('source-api-copy')?.textContent ?? null,
                    importAlert: authorizedFrame.contentDocument
                        .getElementById('import-alert')?.textContent ?? null,
                    reportCount: authorizedFrame.contentDocument
                        .querySelectorAll('.report-card').length ?? 0
                }
                : null;
            realFrame?.remove();
            demoFrame?.remove();
            authorizedFrame?.remove();
            mismatchFrame?.remove();
            navigationFrames.forEach(frame => frame.remove());
            document.body.dataset.status = 'failed';
            state.textContent = 'failed';
            summary.textContent = JSON.stringify({
                status: 'failed',
                code: typeof error?.message === 'string' ? error.message : 'BROWSER_SMOKE_FAILED',
                gates,
                metrics,
                diagnostic
            }, null, 2);
        }
        }
    </script>
</body>
</html>
